name: Synchronize public project metadata
on:
  schedule:
    - cron: "20 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run validate:content
      - name: Commit metadata only when changed
        run: |
          if ! git diff --quiet -- data/github-projects.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/github-projects.json
            git commit -m 'chore(portfolio): refresh approved public repository metadata'
            git push origin HEAD:main
          fi
